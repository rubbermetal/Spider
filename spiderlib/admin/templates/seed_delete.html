{% extends "base.html" %}
{% block title %}Delete seed{% endblock %}
{% block content %}
<h1>Delete seed</h1>
<p>Delete the seed <strong>{{ seed.url }}</strong>?</p>
<p class="muted">Its queued URLs are removed. Pages already crawled are kept (they just stop belonging to a seed).</p>
<form method="post" action="{{ url_for('seeds.delete', seed_id=seed.id) }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <button type="submit">Delete seed</button>
    <a class="btn" href="{{ url_for('seeds.index') }}">Cancel</a>
</form>
{% endblock %}
