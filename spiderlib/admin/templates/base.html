<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Spider{% endblock %} - Spider admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('dashboard.index') }}">Spider</a>
        {% set nav = [('dashboard.index', 'Dashboard'), ('urls.index', 'URLs'), ('seeds.index', 'Seeds'), ('settings.edit', 'Settings')] %}
        <nav>
            {% for ep, label in nav %}<a href="{{ url_for(ep) }}"{% if request.endpoint == ep %} class="active"{% endif %}>{{ label }}</a>{% endfor %}
        </nav>
        <form method="post" action="{{ url_for('auth.logout') }}" class="inline">
            <input type="hidden" name="csrf" value="{{ csrf_token() }}">
            <button class="link" type="submit">Log out</button>
        </form>
    </header>
    <main class="container">
        {% for message in get_flashed_messages() %}<p class="msg ok">{{ message }}</p>{% endfor %}
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='admin.js') }}"></script>
</body>
</html>
